name: mkr_flutter
description: Fan made of MyKampus Radio mobile apps.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.1+6

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: "^3.44.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.2.0
  just_audio: ^0.10.4
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.16
  http: ^1.2.2
  loading_animation_widget: ^1.3.0
  url_launcher: ^6.3.1
  adaptive_theme: ^3.7.0
  desktop_window: ^0.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - images/
